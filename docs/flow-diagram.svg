<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 1060" width="1140" height="1060">
  <defs>
    <!-- Solid arrow marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#000000"/>
    </marker>

    <!-- Dashed arrow marker -->
    <marker id="arrow-dashed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#555555"/>
    </marker>

    <!-- White arrow marker -->
    <marker id="arrow-white" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#ffffff"/>
    </marker>

    <style>
      .font-mono { font-family: 'Geist Mono', 'SF Mono', 'JetBrains Mono', monospace; }
      .font-sans { font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1140" height="1060" fill="#ffffff"/>

  <!-- ==================== HEADER ==================== -->
  <text x="44" y="44" fill="#000000" font-size="10" font-weight="700" class="font-mono" letter-spacing="0.16em">TRAFFIC-GUARD · 9-STAGE LAYER-7 DEFENSE PIPELINE</text>
  <text x="44" y="66" fill="#555555" font-size="13" class="font-sans">Progressive execution lifecycle: O(1) protocol whitelists, wire-order validation, entropy math, and TypeSafe AI escalation</text>
  <line x1="44" y1="82" x2="1096" y2="82" stroke="#000000" stroke-width="1"/>

  <!-- ==================== CLUSTER BOUNDARIES ==================== -->
  <!-- Main Pipeline Cluster (Left to Center) -->
  <rect x="36" y="96" width="620" height="930" rx="12" fill="none" stroke="#000000" stroke-width="1.2"/>
  <rect x="48" y="88" width="230" height="16" rx="3" fill="#ffffff" stroke="#000000" stroke-width="0.8"/>
  <text x="163" y="99" fill="#000000" font-size="8" font-weight="700" class="font-mono" text-anchor="middle" letter-spacing="0.1em">INSPECTION FUNNEL (IN-TREE &lt;30µs)</text>

  <!-- Exit Actions & Arbitration Cluster (Right) -->
  <rect x="680" y="96" width="424" height="930" rx="12" fill="none" stroke="#000000" stroke-width="1.2"/>
  <rect x="692" y="88" width="220" height="16" rx="3" fill="#ffffff" stroke="#000000" stroke-width="0.8"/>
  <text x="802" y="99" fill="#000000" font-size="8" font-weight="700" class="font-mono" text-anchor="middle" letter-spacing="0.1em">EXIT BRANCHES &amp; ARBITRATION</text>

  <!-- ==================== INBOUND REQUEST ROOT ==================== -->
  <rect x="180" y="116" width="330" height="52" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <rect x="190" y="108" width="100" height="15" rx="3" fill="#ffffff" stroke="#000000" stroke-width="0.8"/>
  <text x="240" y="119" fill="#000000" font-size="7.5" font-weight="700" class="font-mono" text-anchor="middle">INGESTION</text>
  <text x="345" y="145" fill="#000000" font-size="12" font-weight="700" class="font-sans" text-anchor="middle">Inbound HTTP / HTTPS Request</text>

  <!-- Spine Line from Root -->
  <line x1="345" y1="168" x2="345" y2="190" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ==================== 9 STAGES ==================== -->

  <!-- STAGE 1: Fast-Path Whitelists -->
  <g class="stage-1">
    <rect x="80" y="190" width="530" height="56" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
    <rect x="90" y="182" width="76" height="15" rx="3" fill="#ffffff" stroke="#000000" stroke-width="0.8"/>
    <text x="128" y="193" fill="#000000" font-size="7.5" font-weight="700" class="font-mono" text-anchor="middle">STAGE 1</text>
    <text x="96" y="214" fill="#000000" font-size="11.5" font-weight="700" class="font-sans">Fast-Path O(1) Whitelists</text>
    <text x="96" y="233" fill="#555555" font-size="9" class="font-mono">Exact path equality (/healthz, /metrics) &amp; client IP match</text>

    <!-- Branch Connector to Exit 1 -->
    <line x1="610" y1="218" x2="710" y2="218" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  </g>

  <!-- Spine 1 -> 2 -->
  <line x1="345" y1="246" x2="345" y2="270" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- STAGE 2: Cryptographic HMAC Pass Cookie -->
  <g class="stage-2">
    <rect x="80" y="270" width="530" height="56" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
    <rect x="90" y="262" width="76" height="15" rx="3" fill="#ffffff" stroke="#000000" stroke-width="0.8"/>
    <text x="128" y="273" fill="#000000" font-size="7.5" font-weight="700" class="font-mono" text-anchor="middle">STAGE 2</text>
    <text x="96" y="294" fill="#000000" font-size="11.5" font-weight="700" class="font-sans">Cryptographic HMAC Pass Cookie</text>
    <text x="96" y="313" fill="#555555" font-size="9" class="font-mono">Valid signed session (__trafficguard token, 0 regex overhead)</text>

    <!-- Branch Connector to Exit 2 -->
    <line x1="610" y1="298" x2="710" y2="298" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  </g>

  <!-- Spine 2 -> 3 -->
  <line x1="345" y1="326" x2="345" y2="350" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- STAGE 3: Canary Honeypot Path Matching -->
  <g class="stage-3">
    <rect x="80" y="350" width="530" height="56" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
    <rect x="90" y="342" width="76" height="15" rx="3" fill="#ffffff" stroke="#000000" stroke-width="0.8"/>
    <text x="128" y="353" fill="#000000" font-size="7.5" font-weight="700" class="font-mono" text-anchor="middle">STAGE 3</text>
    <text x="96" y="374" fill="#000000" font-size="11.5" font-weight="700" class="font-sans">Canary Honeypot Path Matching</text>
    <text x="96" y="393" fill="#555555" font-size="9" class="font-mono">Exact path equality (/__bg_trap) catching web spider crawlers</text>

    <!-- Branch Connector to Exit 3 -->
    <line x1="610" y1="378" x2="710" y2="378" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  </g>

  <!-- Spine 3 -> 4 -->
  <line x1="345" y1="406" x2="345" y2="430" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- STAGE 4: Wire-Order Protocol Sequence -->
  <g class="stage-4">
    <rect x="80" y="430" width="530" height="56" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
    <rect x="90" y="422" width="76" height="15" rx="3" fill="#ffffff" stroke="#000000" stroke-width="0.8"/>
    <text x="128" y="433" fill="#000000" font-size="7.5" font-weight="700" class="font-mono" text-anchor="middle">STAGE 4</text>
    <text x="96" y="454" fill="#000000" font-size="11.5" font-weight="700" class="font-sans">Wire-Order Protocol Sequence</text>
    <text x="96" y="473" fill="#555555" font-size="9" class="font-mono">Array index order: User-Agent before Host flags script spoofing</text>

    <!-- Branch Connector to Exit 4 -->
    <line x1="610" y1="458" x2="710" y2="458" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  </g>

  <!-- Spine 4 -> 5 -->
  <line x1="345" y1="486" x2="345" y2="510" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- STAGE 5: Client Hints & Header Coherence -->
  <g class="stage-5">
    <rect x="80" y="510" width="530" height="56" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
    <rect x="90" y="502" width="76" height="15" rx="3" fill="#ffffff" stroke="#000000" stroke-width="0.8"/>
    <text x="128" y="513" fill="#000000" font-size="7.5" font-weight="700" class="font-mono" text-anchor="middle">STAGE 5</text>
    <text x="96" y="534" fill="#000000" font-size="11.5" font-weight="700" class="font-sans">Client Hints &amp; Header Coherence</text>
    <text x="96" y="553" fill="#555555" font-size="9" class="font-mono">Dictionary lookup: claims Chromium but missing sec-ch-ua</text>

    <!-- Branch Connector to Exit 5 -->
    <line x1="610" y1="538" x2="710" y2="538" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  </g>

  <!-- Spine 5 -> 6 -->
  <line x1="345" y1="566" x2="345" y2="590" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- STAGE 6: Information-Theoretic Entropy -->
  <g class="stage-6">
    <rect x="80" y="590" width="530" height="56" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
    <rect x="90" y="582" width="76" height="15" rx="3" fill="#ffffff" stroke="#000000" stroke-width="0.8"/>
    <text x="128" y="593" fill="#000000" font-size="7.5" font-weight="700" class="font-mono" text-anchor="middle">STAGE 6</text>
    <text x="96" y="614" fill="#000000" font-size="11.5" font-weight="700" class="font-sans">Information-Theoretic Shannon Entropy</text>
    <text x="96" y="633" fill="#555555" font-size="9" class="font-mono">Byte frequency math: H(X) &gt; 4.6 catches obfuscated shellcode</text>

    <!-- Branch Connector to Exit 6 -->
    <line x1="610" y1="618" x2="710" y2="618" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  </g>

  <!-- Spine 6 -> 7 -->
  <line x1="345" y1="646" x2="345" y2="670" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- STAGE 7: Substring Signatures -->
  <g class="stage-7">
    <rect x="80" y="670" width="530" height="56" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
    <rect x="90" y="662" width="76" height="15" rx="3" fill="#ffffff" stroke="#000000" stroke-width="0.8"/>
    <text x="128" y="673" fill="#000000" font-size="7.5" font-weight="700" class="font-mono" text-anchor="middle">STAGE 7</text>
    <text x="96" y="694" fill="#000000" font-size="11.5" font-weight="700" class="font-sans">Substring Signatures (.includes)</text>
    <text x="96" y="713" fill="#555555" font-size="9" class="font-mono">Fast SIMD string match: 'sqlmap', 'nikto', 'union select', 'sleep('</text>

    <!-- Branch Connector to Exit 7 -->
    <line x1="610" y1="698" x2="710" y2="698" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  </g>

  <!-- Spine 7 -> 8 -->
  <line x1="345" y1="726" x2="345" y2="750" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- STAGE 8: Targeted Exploit Regexes -->
  <g class="stage-8">
    <rect x="80" y="750" width="530" height="56" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
    <rect x="90" y="742" width="76" height="15" rx="3" fill="#ffffff" stroke="#000000" stroke-width="0.8"/>
    <text x="128" y="753" fill="#000000" font-size="7.5" font-weight="700" class="font-mono" text-anchor="middle">STAGE 8</text>
    <text x="96" y="774" fill="#000000" font-size="11.5" font-weight="700" class="font-sans">Targeted Exploit Grammar Regexes</text>
    <text x="96" y="793" fill="#555555" font-size="9" class="font-mono">Multi-token grammar inspection: decoded SQLi, XSS, Log4Shell</text>

    <!-- Branch Connector to Exit 8 -->
    <line x1="610" y1="778" x2="710" y2="778" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  </g>

  <!-- Spine 8 -> 9 (Dashed for Cloud Escalation) -->
  <line x1="345" y1="806" x2="345" y2="830" stroke="#000000" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#arrow-dashed)"/>

  <!-- STAGE 9: TypeSafe Cloud ML Tier -->
  <g class="stage-9">
    <rect x="80" y="830" width="530" height="56" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1" stroke-dasharray="4,4"/>
    <rect x="90" y="822" width="104" height="15" rx="3" fill="#ffffff" stroke="#000000" stroke-width="0.8"/>
    <text x="142" y="833" fill="#000000" font-size="7.5" font-weight="700" class="font-mono" text-anchor="middle">STAGE 9 (OPTIONAL)</text>
    <text x="96" y="854" fill="#000000" font-size="11.5" font-weight="700" class="font-sans">TypeSafe Cloud System One (Jev)</text>
    <text x="96" y="873" fill="#555555" font-size="9" class="font-mono">5 typed questions: semantic reasoning on ambiguous / gray-zone traffic</text>

    <!-- Branch Connector to Exit 9 -->
    <line x1="610" y1="858" x2="710" y2="858" stroke="#000000" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#arrow-dashed)"/>
  </g>

  <!-- Spine 9 -> Arbiter -->
  <line x1="345" y1="886" x2="345" y2="920" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Bottom Connector from Spine to Focal Arbiter -->
  <path d="M 345,920 H 660 Q 668,920 668,912 V 790 H 700" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ==================== EXIT ACTIONS (RIGHT COLUMN) ==================== -->

  <!-- Exit 1: ALLOW (< 1µs) -->
  <rect x="716" y="196" width="360" height="44" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <rect x="724" y="204" width="70" height="28" rx="4" fill="#000000"/>
  <text x="759" y="222" fill="#ffffff" font-size="10" font-weight="700" class="font-mono" text-anchor="middle">ALLOW</text>
  <text x="804" y="222" fill="#000000" font-size="10.5" font-weight="700" class="font-mono">&lt; 1 µs</text>
  <text x="856" y="222" fill="#555555" font-size="9.5" class="font-sans">Whitelisted path / IP bypass</text>

  <!-- Exit 2: ALLOW (0 regex) -->
  <rect x="716" y="276" width="360" height="44" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <rect x="724" y="284" width="70" height="28" rx="4" fill="#000000"/>
  <text x="759" y="302" fill="#ffffff" font-size="10" font-weight="700" class="font-mono" text-anchor="middle">ALLOW</text>
  <text x="804" y="302" fill="#000000" font-size="10.5" font-weight="700" class="font-mono">0 regex</text>
  <text x="864" y="302" fill="#555555" font-size="9.5" class="font-sans">Valid signed HMAC session pass</text>

  <!-- Exit 3: BLOCK (Honeypot) -->
  <rect x="716" y="356" width="360" height="44" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <rect x="724" y="364" width="70" height="28" rx="4" fill="#000000"/>
  <text x="759" y="382" fill="#ffffff" font-size="10" font-weight="700" class="font-mono" text-anchor="middle">BLOCK</text>
  <text x="804" y="382" fill="#000000" font-size="10.5" font-weight="700" class="font-mono">HTTP 403</text>
  <text x="870" y="382" fill="#555555" font-size="9.5" class="font-sans">Spider canary honeypot trap</text>

  <!-- Exit 4: CHALLENGE (Wire Disorder) -->
  <rect x="716" y="436" width="360" height="44" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <rect x="724" y="444" width="94" height="28" rx="4" fill="#000000"/>
  <text x="771" y="462" fill="#ffffff" font-size="9.5" font-weight="700" class="font-mono" text-anchor="middle">CHALLENGE</text>
  <text x="828" y="462" fill="#000000" font-size="10.5" font-weight="700" class="font-mono">PoW HashCash</text>
  <text x="918" y="462" fill="#555555" font-size="9.5" class="font-sans">UA before Host</text>

  <!-- Exit 5: FLAG (Header Anomaly) -->
  <rect x="716" y="516" width="360" height="44" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <rect x="724" y="524" width="60" height="28" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="754" y="542" fill="#000000" font-size="10" font-weight="700" class="font-mono" text-anchor="middle">FLAG</text>
  <text x="794" y="542" fill="#000000" font-size="10" font-weight="700" class="font-mono">+0.20 Risk</text>
  <text x="866" y="542" fill="#555555" font-size="9.5" class="font-sans">Missing sec-ch-ua / language</text>

  <!-- Exit 6: FLAG (Entropy Anomaly) -->
  <rect x="716" y="596" width="360" height="44" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <rect x="724" y="604" width="60" height="28" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="754" y="622" fill="#000000" font-size="10" font-weight="700" class="font-mono" text-anchor="middle">FLAG</text>
  <text x="794" y="622" fill="#000000" font-size="10" font-weight="700" class="font-mono">H(X) &gt; 4.6</text>
  <text x="866" y="622" fill="#555555" font-size="9.5" class="font-sans">High-entropy obfuscated payload</text>

  <!-- Exit 7: SUBSTRING MATCH -->
  <rect x="716" y="676" width="360" height="44" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <rect x="724" y="684" width="70" height="28" rx="4" fill="#000000"/>
  <text x="759" y="702" fill="#ffffff" font-size="10" font-weight="700" class="font-mono" text-anchor="middle">BLOCK</text>
  <text x="804" y="702" fill="#000000" font-size="10.5" font-weight="700" class="font-mono">SIMD Fast</text>
  <text x="874" y="702" fill="#555555" font-size="9.5" class="font-sans">Known scanner UA / Exploit sig</text>

  <!-- Exit 8: REGEX MATCH -->
  <rect x="716" y="756" width="360" height="44" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <rect x="724" y="764" width="70" height="28" rx="4" fill="#000000"/>
  <text x="759" y="782" fill="#ffffff" font-size="10" font-weight="700" class="font-mono" text-anchor="middle">BLOCK</text>
  <text x="804" y="782" fill="#000000" font-size="10.5" font-weight="700" class="font-mono">Grammar</text>
  <text x="868" y="782" fill="#555555" font-size="9.5" class="font-sans">SQLi / Log4Shell / XSS pattern</text>

  <!-- Exit 9: TYPESAFE VERDICT -->
  <rect x="716" y="836" width="360" height="44" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1" stroke-dasharray="4,4"/>
  <rect x="724" y="844" width="80" height="28" rx="4" fill="#000000"/>
  <text x="764" y="862" fill="#ffffff" font-size="9" font-weight="700" class="font-mono" text-anchor="middle">SEMANTIC</text>
  <text x="814" y="862" fill="#000000" font-size="10" font-weight="700" class="font-mono">Jev-latest</text>
  <text x="880" y="862" fill="#555555" font-size="9.5" class="font-sans">5 typed Bayesian answers</text>

  <!-- ==================== SIGNATURE FOCAL NODE (SOLID BLACK) ==================== -->
  <g class="focal-arbiter">
    <rect x="708" y="904" width="376" height="106" rx="8" fill="#000000" stroke="#000000" stroke-width="1.2"/>
    <rect x="718" y="896" width="168" height="15" rx="3" fill="#000000" stroke="#ffffff" stroke-width="0.8"/>
    <text x="802" y="907" fill="#ffffff" font-size="7.5" font-weight="700" class="font-mono" text-anchor="middle">HYBRID ARBITER</text>
    
    <text x="724" y="928" fill="#ffffff" font-size="12" font-weight="700" class="font-sans">Policy Arbitration &amp; Enforcement</text>
    <text x="724" y="946" fill="#cccccc" font-size="9" class="font-mono">Synthesizes Stage 1–9 signals + Sliding-Window Rate</text>
    <text x="724" y="962" fill="#ffffff" font-size="9.5" font-weight="600" class="font-mono">Resolves: ALLOW · CHALLENGE · TARPIT · BLOCK</text>
    <text x="724" y="978" fill="#888888" font-size="8.5" class="font-mono">Stateless __trafficguard cookie issued for next cycle</text>
  </g>

</svg>
