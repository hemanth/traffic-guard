<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" width="1100" height="720">
  <defs>
    <!-- Solid arrow marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#000000"/>
    </marker>

    <!-- Dashed arrow marker -->
    <marker id="arrow-dashed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#555555"/>
    </marker>

    <!-- Inverted white arrow marker -->
    <marker id="arrow-white" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#ffffff"/>
    </marker>

    <style>
      .font-mono { font-family: 'Geist Mono', 'SF Mono', 'JetBrains Mono', monospace; }
      .font-sans { font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1100" height="720" fill="#ffffff"/>

  <!-- ==================== HEADER ==================== -->
  <text x="44" y="46" fill="#000000" font-size="10" font-weight="700" class="font-mono" letter-spacing="0.16em">BOT-GATE · HIGH-THROUGHPUT THREAT MITIGATION ARCHITECTURE</text>
  <text x="44" y="68" fill="#555555" font-size="13" class="font-sans">Zero-dependency deterministic pipeline, wire-order sequence validation, and progressive TypeSafe System One arbitration</text>
  <line x1="44" y1="84" x2="1056" y2="84" stroke="#000000" stroke-width="1"/>

  <!-- ==================== CLUSTER BOUNDARIES ==================== -->
  <!-- 1. External Network Ingestion Boundary -->
  <rect x="36" y="100" width="220" height="570" rx="12" fill="none" stroke="#000000" stroke-width="1.2"/>
  <rect x="48" y="92" width="168" height="16" rx="3" fill="#ffffff" stroke="#000000" stroke-width="0.8"/>
  <text x="132" y="103" fill="#000000" font-size="8" font-weight="700" class="font-mono" text-anchor="middle" letter-spacing="0.1em">INBOUND WEB TRAFFIC</text>

  <!-- 2. Local In-Tree Engine Cluster (<30µs) -->
  <rect x="280" y="100" width="370" height="570" rx="12" fill="none" stroke="#000000" stroke-width="1.2"/>
  <rect x="292" y="92" width="230" height="16" rx="3" fill="#ffffff" stroke="#000000" stroke-width="0.8"/>
  <text x="407" y="103" fill="#000000" font-size="8" font-weight="700" class="font-mono" text-anchor="middle" letter-spacing="0.1em">ZERO-DEP IN-TREE ENGINE (&lt;30µs)</text>

  <!-- 3. TypeSafe AI Cloud Boundary (Dashed) -->
  <rect x="674" y="100" width="390" height="210" rx="12" fill="none" stroke="#000000" stroke-width="1" stroke-dasharray="4,4"/>
  <rect x="686" y="92" width="220" height="16" rx="3" fill="#ffffff" stroke="#000000" stroke-width="0.8"/>
  <text x="796" y="103" fill="#000000" font-size="8" font-weight="700" class="font-mono" text-anchor="middle" letter-spacing="0.1em">TYPESAFE AI CLOUD (SYSTEM ONE)</text>

  <!-- 4. Gate Decision Boundary -->
  <rect x="674" y="336" width="390" height="334" rx="12" fill="none" stroke="#000000" stroke-width="1.2"/>
  <rect x="686" y="328" width="180" height="16" rx="3" fill="#ffffff" stroke="#000000" stroke-width="0.8"/>
  <text x="776" y="339" fill="#000000" font-size="8" font-weight="700" class="font-mono" text-anchor="middle" letter-spacing="0.1em">POLICY ARBITRATION</text>

  <!-- ==================== NODES: INBOUND TRAFFIC ==================== -->
  <!-- Inbound Request Node -->
  <rect x="52" y="130" width="188" height="120" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <rect x="62" y="122" width="100" height="15" rx="3" fill="#ffffff" stroke="#000000" stroke-width="0.8"/>
  <text x="112" y="133" fill="#000000" font-size="7.5" font-weight="700" class="font-mono" text-anchor="middle">HTTP/S REQUEST</text>
  <text x="64" y="156" fill="#000000" font-size="11" font-weight="700" class="font-sans">Client Telemetry</text>
  <text x="64" y="174" fill="#555555" font-size="9" class="font-mono">• IP &amp; Client Signature</text>
  <text x="64" y="188" fill="#555555" font-size="9" class="font-mono">• Wire-Order rawHeaders</text>
  <text x="64" y="202" fill="#555555" font-size="9" class="font-mono">• __botgate HMAC Cookie</text>
  <text x="64" y="216" fill="#555555" font-size="9" class="font-mono">• Path, Query &amp; Body</text>

  <!-- Fast-Path Whitelist Bypass -->
  <rect x="52" y="300" width="188" height="96" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <rect x="62" y="292" width="112" height="15" rx="3" fill="#ffffff" stroke="#000000" stroke-width="0.8"/>
  <text x="118" y="303" fill="#000000" font-size="7.5" font-weight="700" class="font-mono" text-anchor="middle">FAST-PATH BYPASS</text>
  <text x="64" y="326" fill="#000000" font-size="11" font-weight="700" class="font-sans">Whitelisted Assets</text>
  <text x="64" y="344" fill="#555555" font-size="9" class="font-mono">• /healthz, /metrics</text>
  <text x="64" y="358" fill="#555555" font-size="9" class="font-mono">• Static /public/ routes</text>
  <text x="64" y="372" fill="#555555" font-size="9" class="font-mono">• Whitelisted client IPs</text>

  <!-- Canary Honeypot Trap Node -->
  <rect x="52" y="470" width="188" height="96" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <rect x="62" y="462" width="112" height="15" rx="3" fill="#ffffff" stroke="#000000" stroke-width="0.8"/>
  <text x="118" y="473" fill="#000000" font-size="7.5" font-weight="700" class="font-mono" text-anchor="middle">CANARY HONEYPOT</text>
  <text x="64" y="496" fill="#000000" font-size="11" font-weight="700" class="font-sans">Spider Canary Trap</text>
  <text x="64" y="514" fill="#555555" font-size="9" class="font-mono">• Invisible crawler links</text>
  <text x="64" y="528" fill="#555555" font-size="9" class="font-mono">• /__bg_trap, hidden DOM</text>
  <text x="64" y="542" fill="#555555" font-size="9" class="font-mono">• Instant unconditional 403</text>

  <!-- ==================== NODES: ZERO-DEP LOCAL ENGINE ==================== -->
  <!-- 1. Wire-Order Sequence Analyzer -->
  <rect x="300" y="130" width="330" height="90" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <rect x="310" y="122" width="144" height="15" rx="3" fill="#ffffff" stroke="#000000" stroke-width="0.8"/>
  <text x="382" y="133" fill="#000000" font-size="7.5" font-weight="700" class="font-mono" text-anchor="middle">HEADER WIRE-ORDER</text>
  <text x="314" y="154" fill="#000000" font-size="11" font-weight="700" class="font-sans">Network Stack Validation</text>
  <text x="314" y="172" fill="#555555" font-size="9" class="font-mono">Verifies Chromium wire sequence: Host → Sec-CH-UA → User-Agent</text>
  <text x="314" y="186" fill="#555555" font-size="9" class="font-mono">Flags spoofed cURL / Python requests masquerading as desktop browsers</text>

  <!-- 2. Stateless HMAC Velocity Tracker -->
  <rect x="300" y="240" width="330" height="90" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <rect x="310" y="232" width="154" height="15" rx="3" fill="#ffffff" stroke="#000000" stroke-width="0.8"/>
  <text x="387" y="243" fill="#000000" font-size="7.5" font-weight="700" class="font-mono" text-anchor="middle">STATELESS VELOCITY</text>
  <text x="314" y="264" fill="#000000" font-size="11" font-weight="700" class="font-sans">Sliding Window HMAC-SHA256 Token</text>
  <text x="314" y="282" fill="#555555" font-size="9" class="font-mono">Zero-database distributed rate tracking: {hash, count, window_ts}</text>
  <text x="314" y="296" fill="#555555" font-size="9" class="font-mono">Triggers tarpitting / latency slowdowns when rate exceeds burst threshold</text>

  <!-- 3. Pattern & Signature Heuristics -->
  <rect x="300" y="350" width="330" height="90" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <rect x="310" y="342" width="144" height="15" rx="3" fill="#ffffff" stroke="#000000" stroke-width="0.8"/>
  <text x="382" y="353" fill="#000000" font-size="7.5" font-weight="700" class="font-mono" text-anchor="middle">PATTERN HEURISTICS</text>
  <text x="314" y="374" fill="#000000" font-size="11" font-weight="700" class="font-sans">Exploit &amp; Scanner Detection</text>
  <text x="314" y="392" fill="#555555" font-size="9" class="font-mono">Linear-time scanning: SQLi, Log4Shell, XSS, Path Traversal, Scanners</text>
  <text x="314" y="406" fill="#555555" font-size="9" class="font-mono">Recursive URL decoding unmasks polyglot and double-encoded payloads</text>

  <!-- 4. HashCash PoW Generator & Verifier -->
  <rect x="300" y="460" width="330" height="90" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <rect x="310" y="452" width="144" height="15" rx="3" fill="#ffffff" stroke="#000000" stroke-width="0.8"/>
  <text x="382" y="463" fill="#000000" font-size="7.5" font-weight="700" class="font-mono" text-anchor="middle">PROOF-OF-WORK</text>
  <text x="314" y="484" fill="#000000" font-size="11" font-weight="700" class="font-sans">Silent HashCash Micro-Challenge</text>
  <text x="314" y="502" fill="#555555" font-size="9" class="font-mono">Issues signed 1.2 KB challenge. Real browsers solve in 15–30 ms</text>
  <text x="314" y="516" fill="#555555" font-size="9" class="font-mono">Exhausts automated scraper CPU loops without CAPTCHA friction</text>

  <!-- ==================== NODES: TYPESAFE SYSTEM ONE ==================== -->
  <rect x="696" y="130" width="346" height="156" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <rect x="706" y="122" width="144" height="15" rx="3" fill="#ffffff" stroke="#000000" stroke-width="0.8"/>
  <text x="778" y="133" fill="#000000" font-size="7.5" font-weight="700" class="font-mono" text-anchor="middle">SYSTEM ONE (JEV)</text>
  <text x="712" y="154" fill="#000000" font-size="12" font-weight="700" class="font-sans">Parallel Typed Semantic Reasoning</text>
  <text x="712" y="172" fill="#555555" font-size="9" class="font-mono">• is_bot: boolean with calibrated probability score</text>
  <text x="712" y="186" fill="#555555" font-size="9" class="font-mono">• is_attack: boolean for novel zero-day vectors</text>
  <text x="712" y="200" fill="#555555" font-size="9" class="font-mono">• attack_type: enum (sqli, xss, probe, rce, scraper, none)</text>
  <text x="712" y="214" fill="#555555" font-size="9" class="font-mono">• risk_score: float [0.00 – 1.00] with reasoning chain</text>
  <text x="712" y="228" fill="#555555" font-size="9" class="font-mono">• Activated when local heuristics reflect high ambiguity</text>

  <!-- ==================== SIGNATURE FOCAL NODE (SOLID BLACK) ==================== -->
  <rect x="696" y="356" width="346" height="136" rx="8" fill="#000000" stroke="#000000" stroke-width="1.2"/>
  <rect x="706" y="348" width="168" height="15" rx="3" fill="#000000" stroke="#ffffff" stroke-width="0.8"/>
  <text x="790" y="359" fill="#ffffff" font-size="7.5" font-weight="700" class="font-mono" text-anchor="middle">HYBRID ARBITER</text>
  <text x="712" y="380" fill="#ffffff" font-size="13" font-weight="700" class="font-sans">Decision Gate &amp; Policy Matrix</text>
  <text x="712" y="400" fill="#cccccc" font-size="9" class="font-mono">Synthesizes deterministic wire signals with AI probabilities:</text>
  <text x="712" y="416" fill="#ffffff" font-size="9.5" font-weight="600" class="font-mono">Risk = Max(HeuristicScore, AIScore) + AnomalyPenalties</text>
  <text x="712" y="432" fill="#cccccc" font-size="9" class="font-mono">Evaluates strict, balanced, or permissive threshold profiles</text>
  <text x="712" y="448" fill="#cccccc" font-size="9" class="font-mono">Resolves state: ALLOW, CHALLENGE, TARPIT, or BLOCK</text>

  <!-- ==================== ACTION RESOLUTION ==================== -->
  <!-- Action Pill 1: ALLOW -->
  <rect x="696" y="520" width="80" height="74" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="736" y="542" fill="#000000" font-size="10" font-weight="700" class="font-mono" text-anchor="middle">ALLOW</text>
  <text x="736" y="558" fill="#555555" font-size="8.5" class="font-mono" text-anchor="middle">HTTP 200</text>
  <text x="736" y="572" fill="#555555" font-size="7.5" class="font-mono" text-anchor="middle">Pass to App</text>

  <!-- Action Pill 2: CHALLENGE -->
  <rect x="784" y="520" width="82" height="74" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="825" y="542" fill="#000000" font-size="10" font-weight="700" class="font-mono" text-anchor="middle">CHALLENGE</text>
  <text x="825" y="558" fill="#555555" font-size="8.5" class="font-mono" text-anchor="middle">HTTP 403</text>
  <text x="825" y="572" fill="#555555" font-size="7.5" class="font-mono" text-anchor="middle">HashCash PoW</text>

  <!-- Action Pill 3: TARPIT -->
  <rect x="874" y="520" width="80" height="74" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="914" y="542" fill="#000000" font-size="10" font-weight="700" class="font-mono" text-anchor="middle">TARPIT</text>
  <text x="914" y="558" fill="#555555" font-size="8.5" class="font-mono" text-anchor="middle">Delay ms</text>
  <text x="914" y="572" fill="#555555" font-size="7.5" class="font-mono" text-anchor="middle">Slow Conns</text>

  <!-- Action Pill 4: BLOCK -->
  <rect x="962" y="520" width="80" height="74" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="1002" y="542" fill="#000000" font-size="10" font-weight="700" class="font-mono" text-anchor="middle">BLOCK</text>
  <text x="1002" y="558" fill="#555555" font-size="8.5" class="font-mono" text-anchor="middle">HTTP 403</text>
  <text x="1002" y="572" fill="#555555" font-size="7.5" class="font-mono" text-anchor="middle">Drop Request</text>

  <!-- ==================== CONNECTORS & ROUTING ==================== -->
  <!-- 1. Inbound Request -> Local Engine (Header Wire-order) -->
  <line x1="240" y1="175" x2="292" y2="175" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 2. Fast-Path Whitelist -> Allow Action -->
  <path d="M 240,348 H 260 V 630 Q 260,638 268,638 H 736 V 602" fill="none" stroke="#000000" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#arrow-dashed)"/>
  <rect x="246" y="440" width="70" height="16" rx="2" fill="#ffffff" stroke="#000000" stroke-width="0.8"/>
  <text x="281" y="451" fill="#000000" font-size="7.5" font-weight="700" class="font-mono" text-anchor="middle">WHITELIST</text>

  <!-- 3. Honeypot Trap -> Block Action -->
  <path d="M 240,518 H 268 V 650 Q 268,658 276,658 H 1002 V 602" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="246" y="570" width="60" height="16" rx="2" fill="#ffffff" stroke="#000000" stroke-width="0.8"/>
  <text x="276" y="581" fill="#000000" font-size="7.5" font-weight="700" class="font-mono" text-anchor="middle">INSTANT BAN</text>

  <!-- 4. Local Engine -> Hybrid Arbiter (Direct Fast-Path) -->
  <line x1="630" y1="395" x2="688" y2="395" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="636" y="386" width="48" height="16" rx="2" fill="#ffffff" stroke="#000000" stroke-width="0.8"/>
  <text x="660" y="397" fill="#000000" font-size="7.5" font-weight="700" class="font-mono" text-anchor="middle">&lt;30µs</text>

  <!-- 5. Local Engine -> TypeSafe Cloud (Ambiguity Escalation) -->
  <path d="M 580,240 V 180 Q 580,172 588,172 H 688" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="600" y="163" width="78" height="16" rx="2" fill="#ffffff" stroke="#000000" stroke-width="0.8"/>
  <text x="639" y="174" fill="#000000" font-size="7" font-weight="700" class="font-mono" text-anchor="middle">AMBIGUOUS / AI</text>

  <!-- 6. TypeSafe Cloud -> Hybrid Arbiter -->
  <line x1="869" y1="286" x2="869" y2="348" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="829" y="306" width="80" height="16" rx="2" fill="#ffffff" stroke="#000000" stroke-width="0.8"/>
  <text x="869" y="317" fill="#000000" font-size="7" font-weight="700" class="font-mono" text-anchor="middle">TYPED VERDICT</text>

  <!-- 7. Hybrid Arbiter -> Action Resolution -->
  <line x1="869" y1="492" x2="869" y2="512" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>

</svg>
