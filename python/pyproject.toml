[project]
name = "bot-gate"
version = "0.1.0"
description = "AI-powered bot and attack detection gate for web traffic using TypeSafe System One."
readme = "README.md"
authors = [
    { name = "Hemanth HM", email = "hemanth@h3manth.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "typesafe-sdk>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bot_gate"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
]
