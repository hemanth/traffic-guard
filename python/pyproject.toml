[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "bot-gate"
version = "0.1.0"
description = "AI-powered bot and attack detection gate for web traffic using TypeSafe System One."
readme = "README.md"
authors = [
    { name = "Hemanth HM", email = "hemanth@h3manth.com" }
]
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
typesafe = ["typesafe-sdk>=0.6.0"]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "typesafe-sdk>=0.6.0",
]

[project.urls]
Home = "https://github.com/hemanth/bot-gate"
